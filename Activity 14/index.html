<!DOCTYPE html>
<html lang="en-US">
  <header>
    <title>Direcho Trabaho Joke or Trivia Generator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/HO14_Joke_Or_Trivia_Generator.css">
  </header>
  <body>
    <header>
      <h1>Joke or Trivia Generator</h1>
    </header>
    <main>
      <div id="main-container">
        <div id="button-container">
          <button id="generate-button">Generate joke or trivia!</button>
        </div>
        <div id="joke-trivia-container">
          <p id="question"></p>
          <p id="answer-container" hidden><strong id="answer"></strong></p>
          <button id="reveal-button" hidden>Reveal</button>
        </div>
      </div>
    </main>
    <script src="js/HO14_Joke_Or_Trivia_Generator.js"></script>
  </body>
</html>
